[project]
name = "agents-runtime"
version = "0.0.0"
description = "LangGraph agent runtime for Paperclip newsletter marketing agency"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langgraph>=0.2.50",
    "anthropic>=0.40.0",
    "mcp>=1.0.0",
    "asyncpg>=0.30.0",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "structlog>=24.4",
    "click>=8.1",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.scripts]
paperclip-agents = "agents_runtime.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "respx>=0.21",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_runtime"]

[tool.hatch.build.targets.wheel.sources]
"src/agents_runtime" = "agents_runtime"

[tool.hatch.build.targets.editable]
packages = ["src/agents_runtime"]

[tool.hatch.build.targets.editable.sources]
"src/agents_runtime" = "agents_runtime"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "ASYNC"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
