services:
  postgres:
    image: postgres:16-alpine
    container_name: paperclip-postgres
    environment:
      POSTGRES_DB: paperclip
      POSTGRES_USER: paperclip
      POSTGRES_PASSWORD: paperclip_dev
    ports:
      - "5434:5432"
    volumes:
      - paperclip_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperclip -d paperclip"]
      interval: 3s
      timeout: 3s
      retries: 10

  agent-runner:
    build:
      context: ..
      dockerfile: agents-runtime/Dockerfile
    profiles: ["full"]
    depends_on:
      postgres: { condition: service_healthy }
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://paperclip:paperclip_dev@postgres:5432/paperclip
      LOG_FILE_DIR: /var/log/paperclip
    volumes:
      - ../agents:/app/agents:ro
      - ../policies:/app/policies:ro
      - /var/log/paperclip:/var/log/paperclip
    command: ["uv", "run", "paperclip-agents", "serve"]

volumes:
  paperclip_pgdata:
