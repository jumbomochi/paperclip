# Production override.
# Use as:
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml up -d
services:
  postgres:
    restart: unless-stopped
    profiles: []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?required}

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    profiles: []
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
